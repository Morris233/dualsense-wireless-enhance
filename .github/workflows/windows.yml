name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable MSVC
        run: rustup update stable-x86_64-pc-windows-msvc --no-self-update
      - name: Test
        run: cargo +stable-x86_64-pc-windows-msvc test --workspace --locked
      - name: Build
        run: cargo +stable-x86_64-pc-windows-msvc build --release --locked -p dsz
      - name: Package executable and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item target/release/dualsense-wireless-enhance.exe dist/
          Copy-Item LICENSE,vendor/opus/COPYING,vendor/eframe/LICENSE-MIT,vendor/eframe/LICENSE-APACHE,crates/dsz/assets/OpenController-LICENSE,crates/ds-proto/DS4-Sound-Link-LICENSE dist/licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: dualsense-wireless-enhance-windows-x64
          path: dist/
          if-no-files-found: error
